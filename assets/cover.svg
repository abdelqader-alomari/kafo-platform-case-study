<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Kafo Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#120a26"/></linearGradient>
    <radialGradient id="a"><stop offset="0" stop-color="#f97316" stop-opacity=".55"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
    <radialGradient id="b"><stop offset="0" stop-color="#22c55e" stop-opacity=".45"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <clipPath id="c"><rect width="1280" height="400" rx="22"/></clipPath>
    <style>.t{font-family:'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .f1{animation:f1 14s ease-in-out infinite} .f2{animation:f2 17s ease-in-out infinite}
      @keyframes f1{50%{transform:translate(70px,25px)}} @keyframes f2{50%{transform:translate(-60px,-25px)}}</style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1280" height="400" fill="url(#bg)"/><rect width="1280" height="400" fill="url(#g)"/>
    <circle class="f1" cx="200" cy="80" r="280" fill="url(#a)"/><circle class="f2" cx="1100" cy="330" r="300" fill="url(#b)"/>
    <text class="t" x="70" y="92" font-size="16" font-weight="700" letter-spacing="3" fill="#22c55e">CASE STUDY · ABDELQADER AL-OMARI</text>
    <text class="t" x="68" y="178" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#tx)">Kafo Platform</text>
    <text class="t" x="70" y="232" font-size="24" fill="#cbd5e1">The digital backbone of a youth development team, end to end</text>
    <g transform="translate(70 300)"><rect width="116" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="58.0" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">Laravel 12</text></g><g transform="translate(198 300)"><rect width="197" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="98.5" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">Inertia + React SSR</text></g><g transform="translate(407 300)"><rect width="98" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="49.0" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">Livewire</text></g><g transform="translate(517 300)"><rect width="71" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="35.5" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">MySQL</text></g><g transform="translate(600 300)"><rect width="53" height="38" rx="11" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".25"/><text x="26.5" y="25" text-anchor="middle" class="t" font-size="16" font-weight="600" fill="#e2e8f0">RTL</text></g>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
